[editions]
discard = a


[settings]
video_color_space = "bt709"
video_color_range = "tv"
audio_format = "wav"
fps = 25

; language = 'en'


[dimensions]
width_final = 1440
height_final = 1080


[video_settings_initial]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le

; [video_settings_initial]
; codec = h264
; pix_fmt = yuv420p


[video_settings_lr]
codec = h264
pix_fmt = yuv420p


[video_settings_upscale]
codec = h265
codec_options = "-preset slow -crf 16 -profile:v main422-10 -x265-params sao=0"
pix_fmt = yuv420p


[video_settings_dsr]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le


[video_settings_hr]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le
pad = 24


