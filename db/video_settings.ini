[common]
frame_rate = 25


[deinterlace]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le


[initial]
codec = h264
codec_options = "-preset slow -crf 16"
pix_fmt = yuv420p


[extract]
codec = h264
codec_options = "-preset slow -crf 16"
pix_fmt = yuv420p
size = 720x576


[sim_lr]
codec = h264
codec_options = "-preset fast"
pix_fmt = yuv420p
size = 720x576

[lr]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le


[upscale]
codec = h265
codec_options = "-preset slow -crf 16 -profile:v main422-10 -x265-params sao=0"
pix_fmt = yuv420p10le


[dsr]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le


[hr]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le
pad = 24


