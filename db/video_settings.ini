[common]
frame_rate = 25


[deinterlace]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le


[initial]
codec = h264
codec_options = "-preset slow -crf 16"
pix_fmt = yuv420p


[extract]
codec = h264
codec_options = "-preset slow -crf 16"
pix_fmt = yuv420p
size = 720x576


[sim_lr]
codec = h264
codec_options = "-preset fast"
pix_fmt = yuv420p
size = 720x576

[lr]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le


[upscale]
codec = hevc_nvenc
codec_options = """
        -profile:v main
        -b_ref_mode disabled
        -tag:v hvc1
        -g 30
        -preset p7
        -tune hq
        -rc constqp
        -qp 17
        -rc-lookahead 20
        -spatial_aq 1
        -aq-strength 15
        -b:v 0
    """
pix_fmt = yuv420p


[dsr]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le


[tf]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le

[concat]
codec = h265
pix_fmt = yuv422p10le
codec_options = """
        -preset slow
        -crf 16
        -profile:v main422-10
        -x265-params
        :bframes=8
        :psy-rd=1
        :sao=0
        :aq-mode=3
    """
; ffmpeg -i ep01_episode_tf_c3decfe.mxf -c:v libx265 -pix_fmt yuv422p10le -preset slow -crf 16 -profile:v main422-10 -x265-params "bframes=8 psy-rd=1 sao=0 aq-mode=3" ep01_episode_tf_c3decfe.mkv -y


[compare]
codec = h265
pix_fmt = yuv420p10le
codec_options = """
        -preset slow
        -crf 16
        -profile:v main422-10
        -x265-params
        bframes=8:sao=0:aq-mode=3
    """


[hr]
codec = dnxhd
codec_options = "-profile:v dnxhr_hqx"
pix_fmt = yuv422p10le
pad = 24


